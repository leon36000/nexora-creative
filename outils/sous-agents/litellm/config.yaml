# Passerelle LiteLLM LÉGÈRE réservée aux sous-agents (hors production, sans base de données).
# Les clés ne sont jamais ici : elles arrivent par variables d'environnement (voir gateway.sh).
model_list:
  # Qwen3.8 Flash Next local sur pc4 (RTX 3090, Strata OpenAI-compatible) — coût nul ($0).
  # Limite conservatrice : max 2 requêtes en parallèle (mono-GPU RTX 3090), file d'attente RPM 24, repli vers eco-deepseek.
  # Carte officielle qwen4exp + budget de réflexion borné (évite le défaut implicite xhigh de Strata).
  - model_name: eco-qwen
    litellm_params:
      model: openai/swift-1.5-qwen3.8-flash-next-abliterated-iq3_s
      api_base: os.environ/STRATA_API_BASE
      api_key: os.environ/STRATA_API_KEY
      temperature: 1.0
      top_p: 0.95
      extra_body:
        top_k: 20
        reasoning_effort: "medium"
        reasoning_budget_tokens: 4096
        reasoning_loop_recovery: "recover"
      max_parallel_requests: 2
      rpm: 24
      timeout: 240
      stream_timeout: 90
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
  # Le moins cher, le plus rapide : modifications en masse, résumés, tests simples (DeepInfra, 0,20 $ / 0,60 $ par M de jetons).
  - model_name: eco-deepseek
    litellm_params:
      model: openai/deepseek-ai/DeepSeek-V4.1-Flash-1017
      api_base: https://api.deepinfra.com/v1/openai
      api_key: os.environ/DEEPINFRA_API_KEY
      input_cost_per_token: 0.0000002
      output_cost_per_token: 0.0000006
      # Consigne du fondateur (04/11/2026) : effort maximal.
      extra_body:
        reasoning_effort: max
      rpm: 600
      timeout: 300
  # Très bon marché (OpenRouter, 0,10 $ / 0,20 $ par M), effort maximal.
  - model_name: eco-muse
    litellm_params:
      model: openrouter/meta/muse-spark-1.3-contributor
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000002
      extra_body:
        reasoning:
          effort: max
      rpm: 600
      timeout: 300
  # Le plus fort : Gemini 4 Argon, point de terminaison Flex SEULEMENT (google-ai-studio/flex, 1 $ / 5 $ par M), effort moyen.
  - model_name: eco-gemini
    litellm_params:
      model: openrouter/google/gemini-4-argon
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      extra_body:
        reasoning:
          effort: medium
        provider:
          order: [google-ai-studio/flex]
          allow_fallbacks: false
      rpm: 120
      timeout: 900
  # Même modèle Flex, effort élevé, pour les tâches difficiles et les revues.
  - model_name: eco-gemini-eleve
    litellm_params:
      model: openrouter/google/gemini-4-argon
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000005
      extra_body:
        reasoning:
          effort: high
        provider:
          order: [google-ai-studio/flex]
          allow_fallbacks: false
      rpm: 120
      timeout: 900
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  disable_spend_logs: true
litellm_settings:
  drop_params: true
  modify_params: true
  turn_off_message_logging: true
  telemetry: false
  callbacks: sa_callbacks.proxy_handler_instance
  # Plafond global de la passerelle (en mémoire, remis à zéro au redémarrage) ; le plafond par exécution est dans sous-agent.sh.
  max_budget: 20
  budget_duration: 30d
router_settings:
  num_retries: 2
  timeout: 600
  allowed_fails: 1
  cooldown_time: 30
  fallbacks:
    - {"eco-qwen": ["eco-deepseek"]}
  context_window_fallbacks:
    - {"eco-qwen": ["eco-deepseek"]}
