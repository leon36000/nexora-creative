:root{--noir:#0A0A0E;--surface:#121218;--papier:#FBFBF8;--creme:#F3F2EC;--sable:#E4E2D9;--texte-clair:#F5F4EF;

.mosaique{position:absolute;inset:0;width:100%;height:100%}
